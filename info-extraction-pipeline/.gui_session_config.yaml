paths:
  input_dir: images
  output_dir: resultImage2Net
  component_weights: pretrainedWeights/componentDetection/best.pt
  junction_jump_weights: pretrainedWeights/junctionJumpDetection/best.pt
  junction_jump_weights_2cls: pretrainedWeights/junctionJumpDetection/best2cls.pt
  orientation_weights: pretrainedWeights/orientationDetection/best_model.pt
  hawp_dir: pretrainedWeights/hawp
params:
  device: cuda
  component_conf: 0.35
  component_iou: 0.45
  mask_pad: 0
  mask_color: white
  orientation_image_size: 224
  ocr_conf: 0.2
  ocr_pad: 0
  combined_hawp_threshold: 0.05
  text_distance: 0.0
  text_keep_line_len: 0
  black_bridge_len: 0
  min_line_length: 4.0
  whitespace_threshold: 240
  whitespace_fraction: 0.8
  extra_endpoint_extend_px: 8.0
  node_union_dist: 8.0
  node_pixel_bridge_dist: 0
  node_pixel_bridge_fill: 0.6
  node_pixel_bridge_radius: 1
  jj_conf: 0.05
  jj_bbox_pad: 2.0
  perp_tol_deg: 45.0
  crossover_probe_dist: 5.0
  crossover_probe_tol: 3.0
  crossover_min_line_len: 6.0
  implicit_jump_min_extend_px: 3.0
  explicit_jump_min_extend_px: 1.0
  jump_edge_component_adjacent_px: 2
  jump_parallel_tol: 10.0
  jj_trust_yolo: false
  g_split_ratio: 0.3
  incidence_close_touch_merge_px: 20.0
  text_touch_margin_px: 3.0
  nearby_line_pin_rescue_px: 20.0
  short_endpoint_margin_px: 1
  min_black_threshold: 35.0
  max_black_threshold: 90.0
  black_threshold_avg_ratio: 0.36
  close_bbox_pin_rescue_px: 30
  mos_passthrough_align_px: 8.0
  amp_diff_align_ratio: 0.1
  short_line_max_gap_px: 3
outputs:
  copy_inputs: true
  keep_visualizations: true
