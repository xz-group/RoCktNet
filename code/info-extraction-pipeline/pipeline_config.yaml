# Schematic-to-netlist pipeline configuration.
# Relative paths are resolved relative to this YAML file.

paths:
  # Used when running a full pipeline without --image or --input-dir.
  input_dir: images

  # All intermediate artifacts, visualizations, and final netlists go here.
  output_dir: output

  # Model and code assets.
  component_weights: pretrainedWeights/componentDetection/best.pt
  junction_jump_weights: pretrainedWeights/junctionJumpDetection/best.pt
  # Older 2-class (junction, jump) model. It is more reliable on the two basic
  # classes; its junction/jump boxes are unioned in to fill spots the 5-class
  # model above missed (overlaps resolve in favor of the 5-class model).
  junction_jump_weights_2cls: pretrainedWeights/junctionJumpDetection/best2cls.pt
  orientation_weights: pretrainedWeights/orientationDetection/best_model.pt
  hawp_dir: pretrainedWeights/hawp

params:
  # Runtime
  # "auto" prefers CUDA, then MPS, then CPU. You may also pin a specific
  # device: "cpu", "cuda", "cuda:0", or "mps" (Apple Silicon).
  device: cuda

  # Step: detect_components
  # YOLO component detection thresholds.
  component_conf: 0.35
  component_iou: 0.45

  # Component masking settings.
  mask_pad: 0
  mask_color: white

  # Step: detect_orientation
  # Crop resize used by the orientation classifier.
  orientation_image_size: 224

  # Step: extract_lines
  # OCR text removal/cache settings.
  ocr_conf: 0.2 #0.2
  ocr_pad: 0

  # HAWP and line filtering settings.
  combined_hawp_threshold: 0.05
  text_distance: 0
  # Stroke-level text removal for line augmentation: inside an OCR text bbox,
  # preserve straight wire runs at least this many px long (so a label sitting
  # on a wire erases only the text strokes, not the wire). Set 0 to disable
  # (erase the whole text bbox as before).
  text_keep_line_len: 0
  # Directional gap bridging in black-pixel recovery: before re-detecting wires
  # from leftover black pixels, close same-row/same-column gaps up to this many
  # px using long thin H/V kernels. Heals breaks that run ALONG a wire (faint
  # pixels dropped by binarization, or a stretch erased with a text bbox) while
  # leaving perpendicular structure/crossings intact. Set ~= the widest broken
  # gap you see (e.g. 18 for text-label gaps). 0 disables (previous behavior).
  black_bridge_len: 0
  min_line_length: 4 #4
  whitespace_threshold: 240
  whitespace_fraction: 0.8

  # Step: generate_nodes
  # Extra extension used later while exporting node-to-component touches.
  extra_endpoint_extend_px: 8 #8.0

  # Distance threshold for grouping nearby line segments into one node.
  node_union_dist: 5.9 # 10 for more aggressive grouping, 6 for less

  # Pixel-evidence bridge in the node union-find. Two line fragments whose gap
  # is larger than node_union_dist but <= this many px are still merged into one
  # node when the gap between them is filled with black pixels in the binary
  # image (the wire is visibly there even though line detection produced no
  # segment across the gap). Guards: lines must be near-parallel, the gap
  # roughly collinear with both, and the gap must not cross a component bbox.
  # Set 0 to disable. Try ~20.
  node_pixel_bridge_dist: 0
  # Fraction of sample points along the gap that must land on a black pixel for
  # the bridge to fire (0..1). Higher = stricter (needs a near-solid wire).
  node_pixel_bridge_fill: 0.6
  # Search radius (px) around each gap sample point when checking for a black
  # pixel; tolerates thin or slightly-misaligned wires.
  node_pixel_bridge_radius: 1

  # Junction/jump YOLO and crossover splitting settings.
  jj_conf: 0.05
  jj_bbox_pad: 2.0
  perp_tol_deg: 45
  crossover_probe_dist: 5.0 #5
  crossover_probe_tol: 3
  # Min length (px) a segment must have to count as a wire when the geometric
  # crossover probe decides whether a near-90-deg touch is a real crossover.
  # Raise this to stop short stub artifacts from faking a 4th arm at T-joints.
  crossover_min_line_len: 6 #3
  # Min outward extension (px) each bbox edge's crossing wire must have for the
  # implicit_jump four-edge validation. Independent of crossover_min_line_len.
  implicit_jump_min_extend_px: 3.0
  explicit_jump_min_extend_px: 1.0
  # In the jump four-edge validation, an edge with no outward wire still counts
  # as satisfied if a component bbox sits within this many px just outside it
  # (the crossing arm runs straight into a masked component). Set 0 to disable.
  jump_edge_component_adjacent_px: 2
  jump_parallel_tol: 10.0
  # Trust the YOLO model directly: skip ALL junction/jump post-processing
  # heuristics (four-edge validation, confidence conflict resolution,
  # junction-wins, implicit->junction conversion). Each detection maps straight
  # to its category: junction->junction; jump & implicit_jump->jump (crossover);
  # diag_jump & diag_implicit_jump->x_jump. Temporary/debug switch.
  jj_trust_yolo: false

  # Step: build_incidence
  # G/B-side occupies this fraction of a MOS/BJT bbox along the orientation axis.
  g_split_ratio: 0.30

  # Merge duplicate same-node corner touches within this distance during incidence assignment.
  incidence_close_touch_merge_px: 20 #8

  # Drop extra touches that land inside or just beside OCR text boxes.
  text_touch_margin_px: 3.0

  # When a pin is missing, search this far outside the expected bbox edge for a line.
  nearby_line_pin_rescue_px: 20.0

  # Pixel checks used when deciding whether two pins inside a bbox are visibly shorted.
  short_endpoint_margin_px: 1
  min_black_threshold: 35
  max_black_threshold: 90
  black_threshold_avg_ratio: 0.36

  # When a pin is missing, rescue it from an overlapping/adjacent component bbox
  # whose edge sits within this many pixels of the expected edge.
  close_bbox_pin_rescue_px: 30

  # MOS gate-wire-through-body detection: a non-G touch on the edge opposite the
  # gate counts as the gate wire passing through when it is within this many pixels
  # of the gate contact on the perpendicular axis (and joined by a black line).
  mos_passthrough_align_px: 8.0

  # Amplifier differential-input detection: the lone input pin is treated as one of
  # a differential pair when its offset from the output pin along the symmetry axis
  # exceeds this fraction of the bbox's perpendicular dimension.
  amp_diff_align_ratio: 0.10

  # Short/black-line detection tolerates a bright break up to this many consecutive
  # pixels (anti-aliasing, junction markers, a crossing wire).
  short_line_max_gap_px: 3

outputs:
  # Copy input images into output_dir/images so downstream step reruns use stable paths.
  copy_inputs: true

  # Reserved for future use; visualizations are currently always generated by the runner.
  keep_visualizations: true
